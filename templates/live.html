<!DOCTYPE html>
<html>
<head>
    <title>AI Live View</title>
    <style>
        body { background: #0f172a; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        .header { padding: 15px; background: #1e293b; display: flex; justify-content: space-between; }
        iframe { flex-grow: 1; border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="header">
        <span>🔴 LIVE: Account ID {{ task_id }}</span>
        <span>Status: {{ step | upper }}</span>
    </div>
    <!-- Ye VNC stream karega. (Server pe x11vnc + noVNC chalu hona chahiye) -->
    <iframe src="http://127.0.0.1:6080/vnc.html?autoconnect=true&resize=scale"></iframe>
</body>
</html>
