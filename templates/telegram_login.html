<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Telegram Direct Login</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; width: 300px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h3 { color: #38bdf8; margin-top: 0; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; background: #334155; color: white; }
        button { width: 100%; padding: 10px; background: #38bdf8; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #0f172a; }
        button:hover { background: #0ea5e9; }
        .hidden { display: none; }
        .msg { color: #fbbf24; margin-top: 15px; font-size: 14px; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Telegram Login</h3>
        <div id="step1">
            <input type="text" id="phone" placeholder="+91XXXXXXXXXX">
            <button onclick="sendOtp()">Send OTP</button>
        </div>
        <div id="step2" class="hidden">
            <input type="text" id="otp" placeholder="Enter OTP">
            <button onclick="verifyOtp()">Verify Login</button>
        </div>
        <div id="msg" class="msg"></div>
        <br>
        <a href="/" style="color: #94a3b8; text-decoration: none; font-size: 14px;">← Back to Dashboard</a>
    </div>

    <script>
        let currentPhone = "";
        
        async function sendOtp() {
            currentPhone = document.getElementById('phone').value;
            document.getElementById('msg').innerText = "Sending...";
            let res = await fetch('/api/tg/send_otp', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: currentPhone})
            });
            let data = await res.json();
            if(data.status === 'success') {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                document.getElementById('msg').innerText = "OTP Sent to Telegram!";
            } else {
                document.getElementById('msg').innerText = "Error: " + data.message;
            }
        }

        async function verifyOtp() {
            let otp = document.getElementById('otp').value;
            document.getElementById('msg').innerText = "Verifying...";
            let res = await fetch('/api/tg/verify_otp', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: currentPhone, otp: otp})
            });
            let data = await res.json();
            if(data.status === 'success') {
                document.getElementById('msg').innerText = "✅ Login Success! Session DB me save ho gaya.";
            } else {
                document.getElementById('msg').innerText = "Error: " + data.message;
            }
        }
    </script>
</body>
</html>
