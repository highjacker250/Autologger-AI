<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pind Panel - AI Auto Login</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 50px; }
        h1 { color: #38bdf8; font-size: 2.5rem; margin-bottom: 10px; }
        .stats-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .stat-box { background: #1e293b; padding: 15px 30px; border-radius: 8px; border-left: 4px solid #38bdf8; }
        .apps-grid { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
        .app-card { background: #1e293b; border-radius: 16px; padding: 30px; width: 200px; cursor: pointer; transition: 0.3s; text-decoration: none; color: white; border: 2px solid transparent; }
        .app-card:hover { transform: translateY(-10px); border-color: #38bdf8; box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2); }
        .app-icon { font-size: 4rem; margin-bottom: 15px; }
        .app-name { font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>
    <h1>⚡ AI Auto Login Panel</h1>
    <div class="stats-bar">
        <div class="stat-box">Total OTPs: <strong>{{ stats.otps }}</strong></div>
        <div class="stat-box">Accounts Created: <strong>{{ stats.accounts }}</strong></div>
    </div>
    <div class="apps-grid">
        <a href="/accounts/facebook" class="app-card">
            <div class="app-icon" style="color: #1877F2;">📘</div>
            <div class="app-name">Facebook</div>
        </a>
        <a href="/accounts/instagram" class="app-card">
            <div class="app-icon" style="color: #E1306C;">📸</div>
            <div class="app-name">Instagram</div>
        </a>
        <a href="/accounts/paypal" class="app-card">
            <div class="app-icon" style="color: #00457C;">💳</div>
            <div class="app-name">PayPal</div>
        </a>
    </div>
</body>
</html>
